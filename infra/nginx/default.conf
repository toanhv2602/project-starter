# Serves the SPA and reverse-proxies /api to the API container (same origin:
# no CORS, and the SameSite=Strict refresh cookie works). TLS terminates in front
# of this container (load balancer, Caddy, Traefik, Cloudflare...).
upstream api_upstream {
  server api:3000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets: cache forever. (add_header here would drop the server-level
  # security headers, so they are repeated via the include-free approach below.)
  location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  # SPA fallback. index.html is served with expires -1 so new deploys are picked up.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
